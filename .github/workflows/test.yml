name: test

on:
  push:
  pull_request:

jobs:
  analyzer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example stays robust after hardening
        run: python skills/goodhart/scripts/analyze.py examples/support-reply/scores-v2.json --fail-on any
