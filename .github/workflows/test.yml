name: test

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Uses a fake judge, so no API access is needed. The committed example
      # analyses must match what analyze.py produces from the committed scores.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
